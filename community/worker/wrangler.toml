name = "tiyouju-community"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "community.tiyouju.com", custom_domain = true }
]

# 一个 Worker 同时提供网页（Vite 打包结果）和 /api。
# 同源才好用 HttpOnly 会话 cookie；/api/* 先进 Worker，其余路径交给静态资源。
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tiyouju-community"
# 在自己的 Cloudflare 账号里 `npx wrangler d1 create tiyouju-community`，把返回的 id 填在这里。
database_id = "1c233b61-3edd-4c13-8d5a-3d2b85901a66"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "tiyouju-community-packs"

[vars]
SITE_NAME = "题有据社区"
# Turnstile 站点密钥是公开的（对应「题有据社区」小组件）。
TURNSTILE_SITE_KEY = "0x4AAAAAAGUDaO1f7mbr5-CX"
MAX_PACK_MB = "15"
# 普通用户个人累计空间上限（MB，管理员不限）
USER_STORAGE_QUOTA_MB = "500"
# 死守 Cloudflare R2 免费 10 GB 配额：留出 1.5 GB 缓冲给收款码、封面和在途上传。
MAX_TOTAL_R2_MB = "8500"
MAX_DAILY_UPLOADS_PER_USER = "5"
# 题包存储模式：默认 "r2"；如需将 .zip 题包存入 123 云盘 WebDAV（封面仍留 R2），设为 "webdav"
# 并通过 `npx wrangler secret put WEBDAV_USERNAME` 和 `WEBDAV_PASSWORD` 配置账号与应用密码。
PACK_STORAGE_MODE = "webdav"
WEBDAV_BASE_URL = "https://webdav.123pan.cn/webdav"
WEBDAV_DIR = "tiyouju-packs"

[triggers]
# 每天 UTC 03:15 清理过期会话、限流记录、失败的半截上传及 7 天前无人购买的已驳回文件。
crons = ["15 3 * * *"]

# 以下只用 `npx wrangler secret put <名字>` 设置，不写进仓库：
#   TURNSTILE_SECRET   Turnstile 服务端密钥
#   DOWNLOAD_SECRET    签发短时下载链接用的随机串（32 字节以上）
# 本机 `wrangler dev` 用 worker/.dev.vars（参照 .dev.vars.example，已被 .gitignore 忽略）。
