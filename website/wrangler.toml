name = "tiyouju-site"
main = "worker.js"
compatibility_date = "2026-04-01"
assets = { directory = "./public", binding = "ASSETS", not_found_handling = "404-page", run_worker_first = ["/api/*", "/download/*"] }
routes = [
  { pattern = "tiyouju.com/*", zone_name = "tiyouju.com" },
  { pattern = "www.tiyouju.com", custom_domain = true }
]

[[r2_buckets]]
bucket_name = "tiyouju-releases"
binding = "RELEASES"

[triggers]
crons = ["*/5 * * * *"]
