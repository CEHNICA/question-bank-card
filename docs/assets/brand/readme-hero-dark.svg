<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">题有据 TiYouJu v2.3.0</title>
  <desc id="hero-dark-desc">本地优先的数学题库与正规组卷工作台：每一道题，都能回到原卷。</desc>
  <defs>
