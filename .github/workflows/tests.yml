name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Test desktop launcher
        run: python -m unittest test_launcher test_backup test_app_window test_credential_dialog test_packaging test_assistant_setup test_create_shortcut
      - name: Test backend
        working-directory: backend
        env:
          QB_EXPORT_BROWSER_TEST: "1"
        run: python manage.py test core
      - name: Test frontend
        run: node --test frontend/test_*.js
