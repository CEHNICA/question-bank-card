  <header class="topbar site-header">
    <a class="brand" href="/" aria-label="题库首页">
      <span class="brand-mark" aria-hidden="true">题</span>
      <span class="brand-text">
        <strong>正式题库</strong>
        <span class="engine-line">收录已标记通过的题面版本</span>
      </span>
    </a>
    <nav class="topnav header-nav" aria-label="页面">
      <a class="header-link" href="/">录入终审</a>
      <a class="header-link active" href="/library" aria-current="page">正式题库</a>

  </header>

  <main class="library-main">
    <section class="library-toolbar" aria-label="查找题目">
      <div class="library-search">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="搜索题干、选项、答案，如 ∠BAD、AB//CD、平行四边形" aria-label="搜索题目" autocomplete="off">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
      <div class="library-filters">
        <label class="library-select">
          <span>来源</span>
          <select id="sourceSelect" aria-label="来源试卷"><option value="">全部试卷</option></select>
        </label>
        <div id="typeFilters" class="draft-filters" role="group" aria-label="题型"></div>
        <label class="library-toggle switch"><input id="answerToggle" type="checkbox"><span class="switch-track" aria-hidden="true"></span>展开答案与解析</label>
      </div>
    </section>

    <p id="libraryStatus" class="library-status" role="status" aria-live="polite">正在读取题库…</p>
    <div id="libraryList" class="library-list"></div>
    <div class="library-more"><button id="moreButton" class="button" type="button" hidden>加载更多</button></div>
  </main>

  <button id="basketButton" class="basket-button no-print" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-basket"/></svg>试题篮 <span id="basketCount">0</span> · 组卷预览</button>

  <dialog id="sourceDialog" class="source-dialog">
    <div class="source-dialog-head">
      <div>
        <p class="eyebrow">查看出处</p>
        <h3 id="sourceTitle">原卷</h3>
        <p class="helper">绿色框是入库题面采用的配图，橙色框是题目文字的来源位置。</p>
      </div>
      <div class="section-tools">
        <a id="sourceReviewLink" class="button button-outline button-small" href="/">打开题卡</a>
        <button class="button button-quiet button-small" type="button" data-close>关闭</button>
      </div>
    </div>
    <div id="sourcePages" class="source-pages"></div>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <div class="confirm-body">
        <span class="confirm-icon" aria-hidden="true"><svg class="icon"><use id="confirmIconUse" href="#i-question"/></svg></span>
        <h3 id="confirmTitle"></h3>
        <p id="confirmText" class="confirm-text"></p>
      </div>
      <div class="confirm-actions">
        <button class="button" value="cancel" type="submit">取消</button>
        <button id="confirmOk" class="button primary" value="ok" type="submit">确定</button>
      </div>
    </form>
  </dialog>

  <section id="printSheet" class="print-sheet" hidden aria-label="组卷预览">
    <div class="print-controls no-print">
      <label class="print-title-field">试卷标题 <input id="printTitle" type="text" value="练习"></label>
      <label class="library-toggle switch"><input id="printAnswers" type="checkbox" checked><span class="switch-track" aria-hidden="true"></span>卷末附答案与解析</label>
      <span class="print-spacer"></span>
      <button id="clearBasket" class="button button-quiet" type="button">清空试题篮</button>
      <button id="closePrint" class="button" type="button">返回题库</button>
      <button id="printButton" class="button button-primary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-printer"/></svg>打印</button>
    </div>
    <article id="printPaper" class="print-paper"></article>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" popover="manual"></div>

  <script src="/vendor/katex/katex.min.js" defer></script>
  <script src="/qb-render.js" defer></script>
  <script src="/library.js" defer></script>
</body>
