<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>题有据 · 正式题库</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/library.css">
</head>
<body class="library-page">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></symbol>
    <symbol id="i-basket" viewBox="0 0 24 24"><path d="M4 9h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8L4 9Z"/><path d="m8.5 9 3.5-5 3.5 5M9.5 13v3M14.5 13v3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-source" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><rect x="7.5" y="7.5" width="9" height="5" rx="1"/><path d="M7.5 16h9"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12h7"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6H7z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4L12 4Z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
    <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.3M12 16.8h.01"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6M12 7v5l3 2"/></symbol>
  </svg>

  <header class="topbar site-header">
    <a class="brand" href="/" aria-label="题有据首页">
      <img class="brand-mark" src="/favicon.png" width="34" height="34" alt="" aria-hidden="true">
      <span class="brand-text">
        <strong>题有据</strong>
        <span class="engine-line">正式题库 · 收录核对通过的题面</span>
      </span>
    </a>
    <nav class="topnav header-nav" aria-label="页面">
      <a class="header-link" href="/">录入终审</a>
      <a class="header-link active" href="/library" aria-current="page">正式题库</a>
    </nav>
    <div class="topbar-tools"><a class="source-link" href="https://github.com/CEHNICA/question-bank-card" target="_blank" rel="noopener noreferrer" title="查看 AGPLv3 源代码">源码</a></div>
  </header>

  <main class="library-main">
    <section class="library-toolbar" aria-label="查找题目">
      <div class="library-search">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="搜索题干、选项、答案，如 ∠BAD、AB//CD、平行四边形" aria-label="搜索题目" autocomplete="off">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
      <div class="library-filters">
        <label class="library-select">
          <span>来源</span>
          <select id="sourceSelect" aria-label="来源试卷"><option value="">全部试卷</option></select>
        </label>
        <div id="typeFilters" class="draft-filters" role="group" aria-label="题型"></div>
        <div id="reviewFilters" class="draft-filters" role="group" aria-label="谁审核的" hidden></div>
        <div id="answerFilters" class="draft-filters" role="group" aria-label="有没有答案" hidden></div>
        <label id="tagFilterBox" class="library-select" hidden>
          <span>知识点</span>
          <select id="tagSelect" aria-label="知识点"><option value="">全部知识点</option></select>
        </label>
      </div>
      <div id="extraTools" class="library-extra-tools" hidden></div>
    </section>

    <p id="libraryStatus" class="library-status" role="status" aria-live="polite">正在读取题库…</p>
    <div id="libraryLoadError" class="library-load-error" role="alert" hidden></div>
    <div id="libraryList" class="library-list"></div>
    <div class="library-more"><button id="moreButton" class="button" type="button" hidden>加载更多</button></div>
  </main>

  <button id="basketButton" class="basket-button no-print" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-basket"/></svg>试题篮 <span id="basketCount">0</span> · 组卷预览</button>

  <dialog id="sourceDialog" class="source-dialog" aria-labelledby="sourceTitle">
    <div class="source-dialog-head">
      <div>
        <p class="eyebrow">查看出处</p>
        <h3 id="sourceTitle">原卷</h3>
        <p class="helper">绿色框是入库题面采用的配图，橙色框是题目文字的来源位置。</p>
      </div>
      <div class="section-tools">
        <a id="sourceReviewLink" class="button button-outline button-small" href="/">打开题卡</a>
        <button class="button button-quiet button-small" type="button" data-close>关闭</button>
      </div>
    </div>
    <div class="source-controls" aria-label="原卷显示方式">
      <button id="sourceQuestion" class="button button-small" type="button" aria-pressed="true">只看本题</button>
      <button id="sourceWholePage" class="button button-small" type="button" aria-pressed="false">整页位置</button>
      <span class="source-control-spacer"></span>
      <button id="sourceZoomOut" class="button button-small" type="button" aria-label="缩小原卷">−</button>
      <output id="sourceZoom" aria-live="polite">100%</output>
      <button id="sourceZoomIn" class="button button-small" type="button" aria-label="放大原卷">＋</button>
      <button id="sourceFit" class="button button-small" type="button">适合窗口</button>
    </div>
    <p id="sourceGestureHint" class="source-gesture-hint">Ctrl + 滚轮缩放 · 按住鼠标左键拖动原卷</p>
    <details id="sourceRelated" class="related-sources" hidden></details>
    <div id="sourcePages" class="source-pages" tabindex="0" aria-label="原卷画布" aria-describedby="sourceGestureHint"></div>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <div class="confirm-body">
        <span class="confirm-icon" aria-hidden="true"><svg class="icon"><use id="confirmIconUse" href="#i-question"/></svg></span>
        <h3 id="confirmTitle"></h3>
        <p id="confirmText" class="confirm-text"></p>
      </div>
      <div class="confirm-actions">
        <button class="button" value="cancel" type="submit">取消</button>
        <button id="confirmOk" class="button primary" value="ok" type="submit">确定</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDialog" class="history-dialog" aria-labelledby="historyTitle">
    <div class="source-dialog-head">
      <div>
        <p class="eyebrow">版本历史</p>
        <h3 id="historyTitle">题目历史</h3>
        <p class="helper">每次改动后重新核对、入库，都会留下一版题面。这里查看的是入库时保存的内容。</p>
      </div>
      <button class="button button-quiet button-small" type="button" data-close>关闭</button>
    </div>
    <p id="historyStatus" class="history-status" role="status" aria-live="polite"></p>
    <details id="historyRelated" class="related-sources" hidden></details>
    <div class="history-layout">
      <nav id="historyVersions" class="history-versions" aria-label="选择历史版本"></nav>
      <section class="history-content" aria-label="查看与比较版本">
        <div id="historyControls" class="history-controls" hidden>
          <label class="library-select">与哪版比较 <select id="historyCompare" aria-label="对照版本"></select></label>
          <span id="historySummary" class="helper"></span>
        </div>
        <div id="historyPreview" class="history-preview"></div>
        <details id="historyDiff" class="history-diff" hidden>
          <summary>查看文字改动（含公式写法）</summary>
          <p class="helper">红色划线是删去的内容，绿色下划线是新增的内容。完整排版见上方题面。</p>
          <div id="historyChanges"></div>
        </details>
      </section>
    </div>
  </dialog>

  <dialog id="printSheet" class="print-sheet" hidden aria-label="组卷预览">
    <div class="print-controls no-print">
      <label class="print-title-field">试卷标题 <input id="printTitle" type="text" value="练习"></label>
      <label class="library-toggle switch"><input id="printAnswers" type="checkbox" checked><span class="switch-track" aria-hidden="true"></span>卷末附答案与解析</label>
      <label class="library-toggle switch" title="题号后面印上题源，例如（2025·北京海淀·期中）"><input id="printOrigin" type="checkbox"><span class="switch-track" aria-hidden="true"></span>印题源</label>
      <label id="printAiBox" class="library-toggle switch" title="原卷没有答案、但有 AI 参考答案的题，卷末附上并标明“AI 参考，未核对”" hidden><input id="printAiAnswers" type="checkbox"><span class="switch-track" aria-hidden="true"></span>附 AI 参考答案</label>
      <span class="print-spacer"></span>
      <button id="clearBasket" class="button button-quiet" type="button">清空试题篮</button>
      <button id="closePrint" class="button" type="button">返回题库</button>
      <button id="printButton" class="button button-primary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-printer"/></svg>打印</button>
    </div>
    <div id="printMissing" class="print-notice no-print" role="alert" hidden></div>
    <div id="printLayoutNotice" class="print-notice no-print" role="alert" hidden></div>
    <p class="print-order-hint no-print">按题型分组，同题型内可上下移动。Esc 返回题库。</p>
    <article id="printPaper" class="print-paper"></article>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" popover="manual"></div>

  <script src="/vendor/katex/katex.min.js" defer></script>
  <script src="/qb-render.js" defer></script>
  <script src="/library.js" defer></script>
</body>
</html>
